<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Live</title>
<style>
body{margin:0;font-family:sans-serif;background:#0A2E4F;color:#fff;text-align:center;padding:28px 16px}
h1{font-size:26px;margin:6px 0 2px}
p{color:#C9D6E3;font-size:15px;line-height:1.9}
.btn{display:block;max-width:420px;margin:16px auto;padding:16px 14px;border-radius:14px;color:#fff;text-decoration:none;font-size:19px;font-weight:bold}
.btn small{display:block;font-weight:normal;font-size:14px;opacity:.9;margin-top:5px}
.new{background:linear-gradient(135deg,#E62117,#8F0E0E)}
.old{background:linear-gradient(135deg,#2563EB,#1E3A8A)}
.note{font-size:13px;color:#9FB3C8;margin-top:22px}
.live{display:inline-block;background:#E62117;color:#fff;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<div style="font-size:52px">🎵</div>
<h1>TikTok <span class="live">LIVE</span></h1>
<p>دو لینک است — هر کدام را می‌خواهید دانلود کنید. حجم هر یک نوشته شده:</p>
<a class="btn new" href="https://drive.google.com/uc?export=download&id=1GOOOLTKUYQzRWNHsNwYVSi9EVpA7IyQ4">لینک جدید<small>حجم: 599 MB — گوگل درایو</small></a>
<a class="btn old" href="https://drive.google.com/uc?export=download&id=1XEfncghuFgYFWka2ST1BWE6RaJnimcb9">لینک فعلی<small>حجم: 631 MB — گوگل درایو</small></a>
<p class="note">در گوگل درایو اگر دکمه «Download anyway» آمد، همان را بزنید.</p>
</body>
</html>
