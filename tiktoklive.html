<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live</title>
<style>
  body { font-family: sans-serif; background: #ffffff; color: #111; margin: 0; padding: 24px 16px; text-align: center; }
  .wrap { max-width: 430px; margin: 0 auto; }
  .logo { font-size: 54px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { font-size: 15px; color: #333; line-height: 1.9; }
  a.btn { display: block; text-decoration: none; color: #fff; border-radius: 14px; padding: 16px 12px; margin: 14px 0; }
  a.tiktok { background: #000000; }
  a.plugin { background: #0f766e; }
  .name { display: block; font-size: 19px; font-weight: bold; }
  .meta { display: block; font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .note { font-size: 13px; color: #555; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🎵</div>
  <h1>TikTok Live</h1>
  <p>دو فایل است — هر کدام را می‌خواهید دانلود کنید. حجم هر یک نوشته شده:</p>

  <a class="btn tiktok" href="https://drive.google.com/uc?export=download&id=126R_iGtAL6baEyFwvHuhLVNBbSKuUtqs">
    <span class="name">TikTok</span>
    <span class="meta">حجم: 519 MB — گوگل درایو</span>
  </a>

  <a class="btn plugin" href="https://drive.google.com/uc?export=download&id=1apTUtZwtErP5Lx1FqBmwkU_rx_06OUV-">
    <span class="name">TikTok Plugin</span>
    <span class="meta">حجم: 16 MB — گوگل درایو</span>
  </a>

  <p class="note">در گوگل درایو اگر دکمه «Download anyway» آمد، همان را بزنید.</p>
</div>
</body>
</html>
